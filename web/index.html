<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico da Reforma Tributária</title><style>
body{font-family:Inter,system-ui,sans-serif;background:#F6F7F4;color:#14201B;margin:0}main{max-width:720px;margin:48px auto;padding:0 20px}
h1{font-size:26px}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 3px #0001}
label{display:block;margin:14px 0 4px;font-weight:600}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cfd5cf;width:100%;box-sizing:border-box}
button{background:#0F6B4F;color:#fff;border:0;margin-top:18px;cursor:pointer;font-weight:600}button:disabled{opacity:.6}
#msg{margin-top:16px}a.btn{display:inline-block;margin-top:10px;color:#0F6B4F;font-weight:600}.err{color:#a11}
</style></head><body><main><h1>Diagnóstico da Reforma Tributária</h1>
<div class="card"><form id="f">
<label>XMLs das notas (NF-e / NFC-e)</label><input type="file" id="arq" multiple accept=".xml" required>
<label>Modo</label><select id="modo"><option value="simulacao">Simulação: projetar o impacto em 2027</option>
<option value="conferencia">Conferência: comparar IBS/CBS declarado × calculado</option></select>
<label>Chave de acesso (API key)</label><input id="chave" type="password" placeholder="deixe vazio em desenvolvimento">
<button id="b">Gerar diagnóstico</button></form><div id="msg"></div></div></main>
<script>
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;msg.textContent="Calculando…";
const fd=new FormData();for(const x of arq.files)fd.append("arquivos",x);fd.append("modo",modo.value);
const h=chave.value?{"X-API-Key":chave.value}:{};
try{const r=await fetch("/api/diagnosticos",{method:"POST",body:fd,headers:h});const d=await r.json();
if(!r.ok)throw new Error(JSON.stringify(d.detail??d));
const rel=await fetch(`/api/diagnosticos/${d.id}/relatorio.html`,{headers:h});const url=URL.createObjectURL(await rel.blob());
msg.innerHTML=`<p>${d.itensComPendencia} de ${d.itensTotal} itens com pendência · ${d.divergencias.length} divergência(s).</p><a class="btn" target="_blank" href="${url}">Abrir relatório</a>`;
}catch(x){msg.innerHTML=`<span class="err">${x.message}</span>`}b.disabled=false};
</script></body></html>
